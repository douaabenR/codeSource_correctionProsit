spring.application.name=apiGatewy
server.port=8085

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Logs
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG

# The Java RouteLocator is the default route source. Activate the
# properties-routes profile to use the equivalent definitions below instead.
#---
spring.config.activate.on-profile=properties-routes

# Route Candidature
spring.cloud.gateway.routes[0].id=CANDIDATURE
spring.cloud.gateway.routes[0].uri=lb://candidature
spring.cloud.gateway.routes[0].predicates[0]=Path=/candidatures/**

# Route Job
spring.cloud.gateway.routes[1].id=JOB
spring.cloud.gateway.routes[1].uri=lb://job
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/jobs(?<remaining>/?.*), /api/jobs$\{remaining}
